```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cheerful Marketplace</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#070808;
    --card:#101111;
    --card2:#141515;
    --text:#f4f5ef;
    --muted:#8d918b;
    --lime:#dfff62;
    --line:rgba(255,255,255,.08);
}

html{
    scroll-behavior:smooth;
}

body{
    background:
        radial-gradient(circle at 15% 0%, rgba(223,255,98,.08), transparent 30%),
        radial-gradient(circle at 90% 15%, rgba(255,255,255,.04), transparent 25%),
        var(--bg);
    color:var(--text);
    font-family:"DM Sans",sans-serif;
    min-height:100vh;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.035;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
    z-index:999;
}

a{
    color:inherit;
    text-decoration:none;
}

button,
input{
    font:inherit;
}

.nav{
    position:sticky;
    top:0;
    z-index:100;
    height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    background:rgba(7,8,8,.78);
    backdrop-filter:blur(20px);
    border-bottom:1px solid var(--line);
}

.logo{
    font-family:"Space Grotesk",sans-serif;
    font-weight:700;
    letter-spacing:-1px;
    font-size:22px;
}

.logo span{
    color:var(--lime);
}

.nav-right{
    display:flex;
    gap:12px;
    align-items:center;
}

.nav-link{
    color:var(--muted);
    font-size:14px;
    padding:9px 13px;
    border-radius:999px;
    transition:.2s;
}

.nav-link:hover{
    color:var(--text);
    background:rgba(255,255,255,.06);
}

.hero{
    width:min(1180px,88%);
    margin:auto;
    padding:100px 0 70px;
}

.eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--lime);
    font-size:12px;
    font-weight:700;
    letter-spacing:1.8px;
    text-transform:uppercase;
    margin-bottom:22px;
}

.dot{
    width:7px;
    height:7px;
    background:var(--lime);
    border-radius:50%;
    box-shadow:0 0 18px var(--lime);
}

.hero h1{
    font-family:"Space Grotesk",sans-serif;
    font-size:clamp(58px,10vw,132px);
    line-height:.85;
    letter-spacing:-7px;
    max-width:1000px;
}

.hero h1 span{
    color:var(--lime);
}

.hero p{
    color:var(--muted);
    font-size:18px;
    line-height:1.7;
    max-width:620px;
    margin-top:32px;
}

.search-wrap{
    width:min(1180px,88%);
    margin:0 auto 35px;
    display:flex;
    gap:12px;
}

.search{
    flex:1;
    background:rgba(255,255,255,.045);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:16px;
    padding:17px 20px;
    outline:none;
    transition:.2s;
}

.search:focus{
    border-color:rgba(223,255,98,.5);
    box-shadow:0 0 0 4px rgba(223,255,98,.05);
}

.search::placeholder{
    color:#666b65;
}

.categories{
    width:min(1180px,88%);
    margin:0 auto 38px;
    display:flex;
    gap:9px;
    flex-wrap:wrap;
}

.filter{
    border:1px solid var(--line);
    background:rgba(255,255,255,.035);
    color:var(--muted);
    padding:9px 15px;
    border-radius:999px;
    cursor:pointer;
    transition:.2s;
}

.filter:hover,
.filter.active{
    background:var(--lime);
    color:#080909;
    border-color:var(--lime);
}

.products{
    width:min(1180px,88%);
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    padding-bottom:100px;
}

.product{
    background:linear-gradient(145deg,var(--card2),var(--card));
    border:1px solid var(--line);
    border-radius:24px;
    overflow:hidden;
    transition:.3s ease;
}

.product:hover{
    transform:translateY(-5px);
    border-color:rgba(223,255,98,.24);
}

.preview{
    height:300px;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
    background:
        linear-gradient(45deg,#171918 25%,transparent 25%),
        linear-gradient(-45deg,#171918 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#171918 75%),
        linear-gradient(-45deg,transparent 75%,#171918 75%);
    background-size:32px 32px;
    background-position:0 0,0 16px,16px -16px,-16px 0;
}

.preview img{
    max-width:100%;
    max-height:240px;
    object-fit:contain;
    filter:drop-shadow(0 15px 25px rgba(0,0,0,.45));
    transition:.3s;
}

.product:hover .preview img{
    transform:scale(1.04);
}

.info{
    padding:21px;
}

.tag{
    color:var(--lime);
    font-size:10px;
    font-weight:700;
    letter-spacing:1.4px;
    text-transform:uppercase;
}

.info h2{
    font-family:"Space Grotesk",sans-serif;
    font-size:20px;
    margin-top:8px;
}

.meta{
    color:var(--muted);
    font-size:13px;
    margin-top:7px;
}

.download{
    width:100%;
    border:none;
    background:var(--lime);
    color:#080909;
    font-weight:700;
    border-radius:12px;
    padding:13px;
    margin-top:19px;
    cursor:pointer;
    transition:.2s;
}

.download:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 30px rgba(223,255,98,.12);
}

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:80px 20px;
    color:var(--muted);
}

.footer{
    border-top:1px solid var(--line);
    padding:30px 6%;
    display:flex;
    justify-content:space-between;
    color:#666b65;
    font-size:13px;
}

.footer span{
    color:var(--lime);
}

@media(max-width:850px){
    .products{
        grid-template-columns:repeat(2,1fr);
    }

    .hero h1{
        letter-spacing:-4px;
    }
}

@media(max-width:580px){
    .nav{
        padding:0 5%;
    }

    .nav-link{
        display:none;
    }

    .hero{
        padding:75px 0 50px;
    }

    .products{
        grid-template-columns:1fr;
    }

    .search-wrap,
    .categories,
    .products{
        width:90%;
    }

    .hero{
        width:90%;
    }

    .hero h1{
        font-size:62px;
    }

    .footer{
        flex-direction:column;
        gap:10px;
    }
}
</style>
</head>

<body>

<nav class="nav">
    <a href="#" class="logo">CHEERFUL<span>.</span></a>

    <div class="nav-right">
        <a class="nav-link" href="#market">Marketplace</a>
        <a class="nav-link" href="https://www.youtube.com/@CheerfulOfficial" target="_blank">
            YouTube ↗
        </a>
    </div>
</nav>

<header class="hero">
    <div class="eyebrow">
        <span class="dot"></span>
        Free creative assets
    </div>

    <h1>
        CHEERFUL<br>
        <span>MARKETPLACE.</span>
    </h1>

    <p>
        Free PNGs, overlays and creative assets for editors.
        Grab what you need, drop it into your timeline and make something awesome.
    </p>
</header>

<div class="search-wrap" id="market">
    <input
        class="search"
        id="search"
        type="text"
        placeholder="Search assets..."
    >
</div>

<div class="categories">
    <button class="filter active" data-category="all">All</button>
    <button class="filter" data-category="PNG">PNGs</button>
    <button class="filter" data-category="Overlay">Overlays</button>
    <button class="filter" data-category="Texture">Textures</button>
    <button class="filter" data-category="Other">Other</button>
</div>

<main class="products" id="products"></main>

<footer class="footer">
    <div>© 2026 <span>Cheerful</span></div>
    <div>Free assets for creators.</div>
</footer>

<script>

/* =========================================================
   ADD YOUR PRODUCTS HERE
   ========================================================= */

const products = [

    {
        name: "Skull PNG #01",
        category: "PNG",
        image: "assets/skull1.png",
        file: "assets/skull1.png",
        description: "Transparent skull PNG"
    },

    {
        name: "Skull PNG #02",
        category: "PNG",
        image: "assets/skull2.png",
        file: "assets/skull2.png",
        description: "Transparent skull PNG"
    },

    {
        name: "Skull PNG #03",
        category: "PNG",
        image: "assets/skull3.png",
        file: "assets/skull3.png",
        description: "Transparent skull PNG"
    }

    /*
    ADD MORE LIKE THIS:

    ,
    {
        name: "Smoke Overlay",
        category: "Overlay",
        image: "assets/smoke.png",
        file: "assets/smoke.png",
        description: "Transparent smoke overlay"
    }

    */

];


/* =========================================================
   MARKETPLACE ENGINE
   ========================================================= */

const productContainer = document.getElementById("products");
const searchInput = document.getElementById("search");
const filters = document.querySelectorAll(".filter");

let currentCategory = "all";

function renderProducts(){

    const searchTerm = searchInput.value.toLowerCase().trim();

    const filtered = products.filter(product => {

        const matchesCategory =
            currentCategory === "all" ||
            product.category === currentCategory;

        const matchesSearch =
            product.name.toLowerCase().includes(searchTerm) ||
            product.description.toLowerCase().includes(searchTerm);

        return matchesCategory && matchesSearch;
    });

    productContainer.innerHTML = "";

    if(filtered.length === 0){

        productContainer.innerHTML = `
            <div class="empty">
                <h2>No assets found.</h2>
                <p>Try another search.</p>
            </div>
        `;

        return;
    }

    filtered.forEach(product => {

        const card = document.createElement("article");

        card.className = "product";

        card.innerHTML = `
            <div class="preview">
                <img
                    src="${product.image}"
                    alt="${product.name}"
                    loading="lazy"
                >
            </div>

            <div class="info">

                <div class="tag">
                    ${product.category}
                </div>

                <h2>${product.name}</h2>

                <div class="meta">
                    ${product.description} · FREE
                </div>

                <button
                    class="download"
                    onclick="downloadAsset('${product.file}', '${product.name}')"
                >
                    DOWNLOAD ↓
                </button>

            </div>
        `;

        productContainer.appendChild(card);
    });
}


/* =========================================================
   DOWNLOAD FUNCTION
   ========================================================= */

function downloadAsset(file, name){

    const link = document.createElement("a");

    link.href = file;
    link.download = name.replace(/\s+/g, "-").toLowerCase();

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);
}


/* =========================================================
   SEARCH
   ========================================================= */

searchInput.addEventListener("input", renderProducts);


/* =========================================================
   CATEGORY FILTERS
   ========================================================= */

filters.forEach(button => {

    button.addEventListener("click", () => {

        filters.forEach(btn =>
            btn.classList.remove("active")
        );

        button.classList.add("active");

        currentCategory =
            button.dataset.category;

        renderProducts();
    });

});


/* INITIAL LOAD */

renderProducts();

</script>

</body>
</html>
